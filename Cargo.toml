[package]
name = "vfx_runtime"
version = "0.1.0"
edition = "2021"
description = "Simulates and draws Smash Ultimate effects (nn::vfx) the way the game does"
license = "MIT"

[dependencies]
effect_library = "1.1.4"
wgpu = "29.0.1"
glam = "0.28.0"

[dev-dependencies]
png = "0.17"
pollster = "0.4"
naga = { version = "29.0.1", features = ["wgsl-in"] }
